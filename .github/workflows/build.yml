name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > $RUNNER_TEMP/tftscryer.keystore
          echo "KEYSTORE_FILE=$RUNNER_TEMP/tftscryer.keystore" >> $GITHUB_ENV

      - name: Build signed release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          VERSION=$(grep 'versionName' app/build.gradle | sed 's/.*"\(.*\)".*/\1/')
          cp app/build/outputs/apk/release/app-release.apk tft-scryer-v${VERSION}.apk
          cp tft-scryer-v${VERSION}.apk tft-scryer.apk
          echo "APK_VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tft-scryer-apk
          path: tft-scryer-v*.apk

      - name: Publish to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "TFT Scryer v${{ env.APK_VERSION }}"
          make_latest: true
          files: |
            tft-scryer-v*.apk
            tft-scryer.apk
          body: |
            **v${{ env.APK_VERSION }}** — latest auto-built APK.
            Download **tft-scryer.apk** below, install on Android (allow unknown sources), grant overlay permission, and scout.
