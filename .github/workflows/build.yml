name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

# one release build at a time, so a slower older run can't overwrite a newer APK
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Install Android SDK platform 34
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Run unit tests (pure logic)
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > $RUNNER_TEMP/tftscryer.keystore
          echo "KEYSTORE_FILE=$RUNNER_TEMP/tftscryer.keystore" >> $GITHUB_ENV

      - name: Build signed release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          VERSION=$(grep 'versionName' app/build.gradle | sed 's/.*"\(.*\)".*/\1/')
          cp app/build/outputs/apk/release/app-release.apk tft-scryer-v${VERSION}.apk
          cp tft-scryer-v${VERSION}.apk tft-scryer.apk
          echo "APK_VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tft-scryer-apk
          path: tft-scryer-v*.apk

      - name: Remove older APKs from the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' 2>/dev/null \
            | grep -E '^tft-scryer-v' | grep -vx "tft-scryer-v${APK_VERSION}.apk" \
            | while read -r a; do gh release delete-asset latest "$a" --repo "$GITHUB_REPOSITORY" -y; done || true

      - name: Publish to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "TFT Scryer v${{ env.APK_VERSION }}"
          make_latest: true
          files: |
            tft-scryer-v*.apk
            tft-scryer.apk
          body: |
            **v${{ env.APK_VERSION }}** — latest auto-built APK.
            Download **tft-scryer.apk** below, install on Android (allow unknown sources), grant overlay permission, and scout.
