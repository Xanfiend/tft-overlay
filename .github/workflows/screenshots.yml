name: Screenshots

# Manual only: renders the app's screens (ScreenshotTest) and commits them to
# docs/screenshots for the README. Does not build or release an APK.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Install Android SDK platform 34
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Render screens
        env:
          SCREENSHOTS: "1"
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --tests '*ScreenshotTest' --no-daemon --stacktrace

      - name: Commit screenshots
        run: |
          mkdir -p docs/screenshots
          cp app/build/screenshots/* docs/screenshots/ 2>/dev/null || true
          ls -la docs/screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          git diff --cached --quiet && echo "no changes" || (git commit -m "Update screenshots [skip ci]" && git push)
