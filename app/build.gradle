plugins {
    id 'com.android.application'
}

android {
    namespace 'com.xanfiend.tftoverlay'
    compileSdk 34

    defaultConfig {
        applicationId "com.xanfiend.tftoverlay"
        minSdk 24
        targetSdk 34
        versionCode 115
        versionName "1.99.3"
    }

    // Consistent signing: reads keystore + passwords from environment
    // variables set by the GitHub Actions workflow (from repo secrets).
    // This makes every build sign identically, so updates install
    // over-the-top with no "package conflicts" error.
    signingConfigs {
        release {
            def ksFile = System.getenv("KEYSTORE_FILE")
            if (ksFile != null) {
                storeFile file(ksFile)
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            // debug stays as-is for local/unsigned fallback
        }
    }
    lintOptions {
        abortOnError false
    }
    testOptions {
        unitTests {
            includeAndroidResources = true   // Robolectric needs the merged resources/manifest
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    // Bundled ML Kit — model lives in the APK (~4 MB), no network needed at runtime
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    // JVM unit tests for the pure logic (no Android framework calls) — run in CI
    testImplementation 'junit:junit:4.13.2'
    // Robolectric: lets unit tests run real Android framework classes (e.g. Pool's
    // SharedPreferences) on the JVM, no device/emulator needed.
    testImplementation 'org.robolectric:robolectric:4.11.1'
    testImplementation 'androidx.test:core:1.5.0'
}
